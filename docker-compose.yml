services:

  #service postgres
  postgres-db:
    image: postgres:16-alpine
    container_name: auto_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: AUTO
    ports:
      #"host:container"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: